# ============================================================
# XLRGuiCrop 主配置文件
# GUI 布局 / 标题 / 槽位 / 升级 / 解锁价格 / 每级产量 见 gui.yml
# 语言文本统一在下方 message: 顶级主键下（可单独按语言替换）
# 修改后需重启插件生效
# ============================================================

# ---------- 存储 ----------
storage:
  # SQLite 数据库文件（相对服务端根目录）
  db-file: "plugins/XLRGuiCrop/data.db"

# ---------- 调度 ----------
tick:
  # 自动收割结算间隔（秒）；离线期间按真实时间补算，越短结算越及时、DB 压力越大
  interval-sec: 60

# ---------- 农田 ----------
farm:
  # 补种/自动重播 1 格消耗的种子数
  replant-cost-seed: 1
  # 删除农田聊天二次确认超时（秒）
  delete-confirm-timeout-sec: 60
  # 玩家默认可拥有的农田数量上限；设为 0 = 关闭该上限（不限制），
  # 农田扩张完全由下方农田页解锁体系（unlock-batch / unlock-price）控制——
  # 解锁多少种植格就能建多少田，避免「解锁了格子却因上限建不了田」的逻辑矛盾。
  # 拥有动态权限 xlr.crop.create.farm.<数字> 的玩家仍按权限数字设上限（见 plugin.yml）
  default-max-farms: 0
  # 农田页内「黄色待解锁批」的格数（一次付费解锁一批；默认 3 个）
  unlock-batch: 3
  # 解锁一批黄色种植格所需金币（config.yml 数值配置）
  unlock-price: 1000
  # 玩家解锁满一页（28 格）后是否自动解锁下一页：
  # true = 满页自动解锁下一页；false = 关闭自动解锁，只能通过管理员指令 /xlr crop update farm <玩家> <页数> 解锁
  auto-unlock-next-page: true

# ---------- 仓库 ----------
warehouse:
  # 每个作物单类库存（种子/产物分别计算）上限，超出部分不再入账；设为 0 表示不限制
  max-stock: 0

# ---------- 骨粉 ----------
bonemeal:
  # 自动重播时骨粉加速系数（成熟时长 × 该值，缩短比例 = 1 - 系数）
  fast-factor: 0.8
  # 骨粉加速每次消耗骨粉数
  fast-cost: 1

crops:
  # 作物 id（唯一标识，命令 /xlr crop create <id> 与 DB 使用，用小写英文）
  wheat:
    # 种植/补种/重播消耗的种子材质（Material 名）——也是刚种下/未成熟的图标。
    # 注：原 icon 配置已废弃，界面图标统一用种子素材（种下）与产物材质（成熟）
    seed-material: WHEAT_SEEDS
    # 收割产物材质（Material 名）——成熟图标、仓库展示/取出用它
    product-material: WHEAT
    # 收割入仓材质一般与 product-material 相同；若不同（如西瓜成熟展示 MELON、
    # 入仓为西瓜片 MELON_SLICE）由代码内置映射自动处理，无需在此配置
    # 作物显示名（GUI、消息中使用）
    name: "小麦"
    # 农田显示名（农田格/创建条目/生长界面标题）
    farm-name: "小麦农田"
    # 每周期生长随机时长下限（小时）
    grow-min-hour: 2
    # 每周期生长随机时长上限（小时）
    grow-max-hour: 4
    # 创建/补种/自动重播是否消耗种子（false = 不消耗，直接满种）
    consume-seed: true
    # 生长界面是否随阶段切换图标（true = 前期种子图标、后期成品图标；false = 始终成品图标）
    show-stage-change: true
    # 从该生长阶段（0-7）起展示 product-material 图标（此前展示 seed-material）；仅 show-stage-change=true 时生效
    show-product-stage: 3
  beetroot:
    icon: BEETROOT
    seed-material: BEETROOT_SEEDS
    product-material: BEETROOT
    name: "甜菜根"
    farm-name: "甜菜根农田"
    grow-min-hour: 1
    grow-max-hour: 3
    consume-seed: true
    show-stage-change: false
    show-product-stage: 3
  carrot:
    icon: CARROT
    # 占位种子素材（与产物不同，会生成独立种子仓库入口；随意填，后续可改）
    seed-material: GOLDEN_CARROT
    product-material: CARROT
    name: "胡萝卜"
    farm-name: "胡萝卜农田"
    grow-min-hour: 1
    grow-max-hour: 3
    consume-seed: true
    show-stage-change: false
    show-product-stage: 3
  potato:
    icon: POTATO
    seed-material: BAKED_POTATO
    product-material: POTATO
    name: "马铃薯"
    farm-name: "马铃薯农田"
    grow-min-hour: 1
    grow-max-hour: 3
    consume-seed: true
    show-stage-change: false
    show-product-stage: 3
  melon:
    icon: MELON
    seed-material: MELON_SEEDS
    # 成熟后展示的物品（Material 名）——生长后期图标、成熟图标用它
    product-material: MELON
    # 收割入仓材质由代码内置映射（西瓜成熟展示 MELON、入仓自动为西瓜片 MELON_SLICE），无需配置
    name: "西瓜"
    farm-name: "西瓜农田"
    grow-min-hour: 2
    grow-max-hour: 4
    consume-seed: true
    show-stage-change: true
    show-product-stage: 3
  pumpkin:
    icon: PUMPKIN
    seed-material: PUMPKIN_SEEDS
    product-material: PUMPKIN
    name: "南瓜"
    farm-name: "南瓜农田"
    grow-min-hour: 2
    grow-max-hour: 4
    consume-seed: true
    show-stage-change: true
    show-product-stage: 3
  bamboo:
