# /xlr crop comp说明
# 给腐竹（管理员）用的「资源找回 / 补货台账」工具，防止玩家物品在数据库出问题时凭空消失。
# 正常情况下玩家进出的种子、骨粉、作物都很安全；但万一数据库卡了/服务器崩了，
# 有玩家被扣了种子却没拿到东西（比如补种退回库存失败、收割入账失败等），
# 插件会自动记一张「补偿单」（存在数据库 compensation 表里），用下面的指令核对和补发：
#   /xlr crop comp list          —— 看有多少张没处理的补偿单（谁的、什么物品、几个、什么原因）
#   /xlr crop comp replay <id>   —— 按单号把东西重新补回给玩家（插件每次启动也会自动补一遍，
#                                    这个指令是给自动补不进、或想手动再补一次的用）
#   /xlr crop comp done <id>     —— 人工核对完，手动把某张单标记为「已处理」，以后不会再重复补
# 一句话：数据库出问题时的防丢物品补货台账，自动补发失败后靠管理员用这些指令兜底。
