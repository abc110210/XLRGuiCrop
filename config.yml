    product-material: BROWN_MUSHROOM
    name: "蘑菇"
    farm-name: "蘑菇农田"
    grow-min-hour: 1
    grow-max-hour: 3
    consume-seed: true
    show-stage-change: false
    show-product-stage: 3
  kelp:
    icon: KELP
    seed-material: TUBE_CORAL
    product-material: KELP
    name: "海带"
    farm-name: "海带农田"
    grow-min-hour: 1
