# ================= 骨粉储存 Gui =================
Bone:
    name: "骨粉储存器 · 第 %page% 页"
    Fill:
        material: BLACK_STAINED_GLASS_PANE
        name: ""
        Lore:
            - ""
    # 升级解锁（每页固定第6行第5格 slot49；%money%/%page% 由代码填充）
    Update:
        material: CHEST
        slot: 49
        name: "&a升级解锁下一页"
        Lore:
            - "&b花费 %money% 金币来解锁第 %page% 页"
    # 下一页（第6行第6格 slot50）
    Nextpage:
        material: ARROW
        slot: 50
        name: "&a下一页"
        Lore:
            - ""
    # 上一页（第6行第4格 slot48，仅第 2 页起）
    Prvepage:
        material: ARROW
        slot: 48
        name: "&a上一页"
        Lore:
            - ""
    # 返回上一个菜单（第6行第1格 slot45，羽毛）
    Back:
        material: FEATHER
        name: "&a返回上一个菜单"
        Lore:
            - ""

# ================= 骨粉页面升级价格 =================
# 解锁第 N 页价格 = Page2.Money × (N-1) 线性递增（代码只读 Page2 作基准，勿另配 Page3/Page4 等，不会被读取）
UpdateBone:
    # 第一页默认解锁，所以从第二页开始
    Page2:
        Money: 1000

# ================= 农作物仓库 Gui =================
Crop:
    name: "农作物仓库 · 第 %page% 页"
    Fill:
        material: BLACK_STAINED_GLASS_PANE
        name: ""
        Lore:
            - ""
    # 农作物仓库入口条目（所有作物共用，用变量区分，无需逐一写死）：
    #   material 支持 %icon%（种子入口=该作物种子材质、产物入口=该作物产物材质）——% 开头的值必须加引号
    #   Lore / name 支持 %name%（作物名）与 %Farmitem%
    CropStorage:
        material: "%icon%"
        name: ""
        Lore:
            - "&a点击进入 %name% 仓库"
    # 翻页（同格：第 1 页下一页 / 第 2 页上一页；第6行第5格 slot49）
    Nextpage:
        material: ARROW
        slot: 49
        name: "&a下一页"
        Lore:
            - ""
    Prvepage:
        material: ARROW
        slot: 49
        name: "&a上一页"
        Lore:
            - ""
    # 返回主菜单（第6行第1格 slot45，羽毛）
    Back:
        material: FEATHER
        name: "&a返回主菜单"
        Lore:
            - ""

# ================= 对应作物仓库 Gui =================
# 农作物仓库入口条目见上方 Crop 段下的 CropStorage（材质/名称/Lore 用变量渲染）
CropStorage:
    name: "%Farmitem%"
    Fill:
        material: BLACK_STAINED_GLASS_PANE
        name: ""
        Lore:
            - ""
    # 补货
    Restock:
        material: CHEST
        slot: 49
        name: "&a点击填充"
        Lore:
            - ""
    # 返回（第6行第1格 slot45，羽毛）
    Back:
        material: FEATHER
        slot: 45
        name: "&a返回农作物仓库"
        Lore:
            - ""

# ================= 给上面 Gui 使用 =================
# 作物显示名/农田名已由 config.yml 的 crops 段（name / farm-name）提供，此处不再重复
