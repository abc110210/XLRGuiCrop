# ================= 骨粉储存 Gui =================
Bone:
    name: "骨粉储存器 · 第 %page% 页"
    Fill:
        material: BLACK_STAINED_GLASS_PANE
        name: ""
        Lore:
            - ""
    # 升级解锁（%money%/%page% 由代码填充）
    Update:
        material: CHEST
        slot: 49
        name: "&a升级解锁下一页"
        Lore:
            - "&b花费 %money% 金币来解锁第 %page% 页"
    Nextpage:
        material: ARROW
        slot: 51
        name: "&a下一页"
        Lore:
            - ""
    Prvepage:
        material: ARROW
        slot: 47
        name: "&a上一页"
        Lore:
            - ""

# ================= 骨粉页面升级价格 =================
UpdateBone:
    # 第一页默认解锁，所以从第二页开始
    Page2:
        Money: 1000
    Page3:
        Money: 2000
    Page4:
        Money: 3000

# ================= 农作物仓库 Gui =================
Crop:
    name: "农作物仓库 · 第 %page% 页"
    Fill:
        material: BLACK_STAINED_GLASS_PANE
        name: ""
        Lore:
            - ""
    # 作物仓库入口（后续新增作物按 {CropId}Seed / {CropId} 约定扩展）
    WheatSeed:
        material: WHEAT_SEEDS
        slot: 10
        name: "&6小麦种子仓库"
        Lore:
            - ""
    Wheat:
        material: WHEAT
        slot: 11
        name: "&6小麦仓库"
        Lore:
            - ""
    # 翻页（同格：第 1 页下一页 / 第 2 页上一页）
    Nextpage:
        material: ARROW
        slot: 49
        name: "&a下一页"
        Lore:
            - ""
    Prvepage:
        material: ARROW
        slot: 49
        name: "&a上一页"
        Lore:
            - ""

# ================= 对应作物仓库 Gui =================
CropStorage:
    name: "%Farmitem%"
    Fill:
        material: BLACK_STAINED_GLASS_PANE
        name: ""
        Lore:
            - ""
    # 补货
    Restock:
        material: CHEST
        slot: 49
        name: "&a点击填充"
        Lore:
            - ""
    # 返回
    Back:
        material: ARROW
        slot: 47
        name: "&a返回农作物仓库"
        Lore:
            - ""

# ================= 给上面 Gui 使用 =================
# 作物显示名/农田名已由 config.yml 的 crops 段（name / farm-name）提供，此处不再重复
